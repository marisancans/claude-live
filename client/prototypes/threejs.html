<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Three.js Renderer Prototype — claude-live</title>
<style>
  body { margin: 0; overflow: hidden; background: #050510; }
  #canvas-container { width: 100vw; height: 100vh; position: relative; }
  #info {
    position: fixed; top: 10px; left: 10px; z-index: 10;
    font: 13px/1.4 monospace; color: #80d4e7;
    background: rgba(3,3,8,0.8); padding: 6px 10px; border-radius: 4px;
    border: 1px solid rgba(26,58,74,0.3);
  }
  #controls {
    position: fixed; bottom: 10px; left: 10px; z-index: 10;
    font: 12px/1.6 monospace; color: #80d4e7;
    background: rgba(3,3,8,0.8); padding: 8px 12px; border-radius: 4px;
    border: 1px solid rgba(26,58,74,0.3);
  }
  #controls button {
    font: 12px monospace; color: #80d4e7; background: rgba(26,58,74,0.4);
    border: 1px solid rgba(26,58,74,0.5); border-radius: 3px;
    padding: 4px 10px; cursor: pointer; margin: 2px;
  }
  #controls button:hover { background: rgba(26,58,74,0.7); }
  /* CSS2D labels */
  .node-label {
    font: 10px monospace; color: rgba(180,200,220,0.6);
    white-space: nowrap; pointer-events: none;
    text-shadow: 0 0 4px rgba(0,0,0,0.8);
  }
  .cluster-label {
    font: 11px monospace; color: rgba(128,212,231,0.7);
    white-space: nowrap; pointer-events: none;
    text-shadow: 0 0 6px rgba(0,0,0,0.9);
  }
</style>
</head>
<body>
<div id="info">-- fps</div>
<div id="controls">
  <div>Three.js Renderer Prototype</div>
  <button id="btn-add-node">Add Node</button>
  <button id="btn-projectile">Fire Projectile</button>
  <button id="btn-burst">Particle Burst</button>
  <button id="btn-toggle-bloom">Toggle Bloom</button>
</div>
<div id="canvas-container"></div>
<script type="module" src="../src/prototypes/threejs-prototype.ts"></script>
</body>
</html>

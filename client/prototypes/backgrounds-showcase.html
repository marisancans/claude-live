<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Background Prototypes — claude-live</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a14;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: auto auto;
    gap: 16px;
    padding: 16px;
    width: 100vw;
    height: 100vh;
    align-content: center;
    justify-items: center;
  }

  .cell {
    position: relative;
    width: 500px;
    height: 350px;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    border: 1px solid rgba(100, 140, 200, 0.15);
    transition: opacity 0.2s, border-color 0.2s;
  }
  .cell:hover {
    border-color: rgba(100, 140, 200, 0.4);
  }

  .canvas-wrap {
    width: 100%;
    height: 100%;
  }
  .canvas-wrap canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }

  .label {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: rgba(180, 200, 230, 0.85);
    background: linear-gradient(transparent, rgba(5, 5, 16, 0.8));
    pointer-events: none;
  }

  /* Bottom row: 2 cells centered */
  .cell:nth-child(4) { grid-column: 1 / 2; justify-self: end; }
  .cell:nth-child(5) { grid-column: 2 / 3; justify-self: start; }

  /* Fullscreen mode */
  #grid.fullscreen-mode {
    display: block;
    padding: 0;
    gap: 0;
  }
  #grid.fullscreen-mode .cell.hidden {
    display: none;
  }
  #grid.fullscreen-mode .cell.expanded {
    width: 100vw;
    height: 100vh;
    border-radius: 0;
    border: none;
  }
  #grid.fullscreen-mode .cell.expanded .label {
    font-size: 16px;
    padding: 12px 20px;
  }

  #fps {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 100;
    font: 12px/1.4 monospace;
    color: #80d4e7;
    background: rgba(5, 5, 16, 0.85);
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid rgba(26, 58, 74, 0.3);
    pointer-events: none;
  }

  #hint {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    font: 11px/1.4 monospace;
    color: rgba(140, 170, 210, 0.5);
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="fps">-- fps</div>
<div id="hint">click any background to go fullscreen / click again to return</div>
<div id="grid"></div>
<script type="module" src="../src/prototypes/backgrounds-showcase.ts"></script>
</body>
</html>

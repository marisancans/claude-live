<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Node Styles — Shader Variations</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; padding: 14px; z-index: 1; pointer-events: none; }
  .tab { pointer-events: all; background: rgba(20,30,60,0.7); border: 1px solid #335; color: #8af; padding: 6px 18px; border-radius: 4px; cursor: pointer; font: 13px 'Segoe UI', sans-serif; transition: all 0.2s; }
  .tab:hover { background: rgba(40,60,120,0.7); }
  .tab.active { background: rgba(60,100,200,0.5); border-color: #68f; color: #fff; }
  .info { position: fixed; bottom: 20px; left: 20px; color: #5a7a9a; font: 11px 'Segoe UI', sans-serif; z-index: 1; pointer-events: none; max-width: 500px; line-height: 1.5; }
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>
</head>
<body>
<div class="hud">
  <button class="tab active" onclick="setMode(0)">A — Plasma Core</button>
  <button class="tab" onclick="setMode(1)">B — Nebula Puff</button>
  <button class="tab" onclick="setMode(2)">C — Star Flare</button>
  <button class="tab" onclick="setMode(3)">D — Electric Ember</button>
</div>
<div class="info" id="info"></div>
<script>
var W = window.innerWidth, H = window.innerHeight
var renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setSize(W, H)
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
renderer.setClearColor(0x020210)
document.body.appendChild(renderer.domElement)

var scene = new THREE.Scene()
var camera = new THREE.PerspectiveCamera(60, W/H, 0.1, 3000)
camera.position.set(0, 40, 150)
camera.lookAt(0, 0, 0)

var pivot = new THREE.Group()
scene.add(pivot)

// Core
var icoMat = new THREE.LineBasicMaterial({ color: 0x4488ff, transparent: true, opacity: 0.4 })
pivot.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(5, 1)), icoMat))
var gc = document.createElement('canvas'); gc.width=gc.height=128
var gx = gc.getContext('2d'), gg = gx.createRadialGradient(64,64,0,64,64,64)
gg.addColorStop(0,'rgba(80,140,255,0.5)'); gg.addColorStop(0.4,'rgba(40,80,200,0.15)'); gg.addColorStop(1,'rgba(0,0,40,0)')
gx.fillStyle=gg; gx.fillRect(0,0,128,128)
var coreSpr = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(gc), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }))
coreSpr.scale.set(20,20,1)
pivot.add(coreSpr)

var COLORS = [0x4fc3f7,0x81c784,0xffb74d,0xe57373,0xba68c8,0x4dd0e1,0xfff176,0xf48fb1]
var NODE_COUNT = 100

var nodeData = []
for (var i = 0; i < NODE_COUNT; i++) {
  var rx = (Math.random()-0.5)*2*(15+Math.pow(Math.random(),0.6)*80)*(0.4+Math.random()*2.1)
  var ry = (Math.random()-0.5)*2*(15+Math.pow(Math.random(),0.6)*80)*(0.1+Math.random()*0.4)
  var rz = (Math.random()-0.5)*2*(15+Math.pow(Math.random(),0.6)*80)*(0.4+Math.random()*2.1)
  nodeData.push({
    pos: new THREE.Vector3(rx, ry, rz),
    color: new THREE.Color(COLORS[Math.floor(Math.random()*COLORS.length)]),
    phase: Math.random() * Math.PI * 2,
    size: 0.4 + Math.random() * 0.6
  })
}

// Shared vertex shader — all modes use Points with custom ShaderMaterial
var SHARED_VERT = [
  'attribute float aSize;',
  'attribute float aPhase;',
  'uniform float uTime;',
  'uniform float uPixelRatio;',
  'uniform float uBaseSize;',
  'varying vec3 vColor;',
  'varying float vPhase;',
  'varying float vSize;',
  'void main() {',
  '  vColor = color;',
  '  vPhase = aPhase;',
  '  vSize = aSize;',
  '  vec4 mvPos = modelViewMatrix * vec4(position, 1.0);',
  '  float pulse = 0.85 + 0.15 * sin(uTime * 1.5 + aPhase);',
  '  gl_PointSize = aSize * pulse * uBaseSize * uPixelRatio / -mvPos.z;',
  '  gl_Position = projectionMatrix * mvPos;',
  '}'
].join('\n')

function buildGeo() {
  var positions = new Float32Array(NODE_COUNT * 3)
  var colors = new Float32Array(NODE_COUNT * 3)
  var sizes = new Float32Array(NODE_COUNT)
  var phases = new Float32Array(NODE_COUNT)
  for (var i = 0; i < NODE_COUNT; i++) {
    positions[i*3] = nodeData[i].pos.x; positions[i*3+1] = nodeData[i].pos.y; positions[i*3+2] = nodeData[i].pos.z
    colors[i*3] = nodeData[i].color.r; colors[i*3+1] = nodeData[i].color.g; colors[i*3+2] = nodeData[i].color.b
    sizes[i] = nodeData[i].size
    phases[i] = nodeData[i].phase
  }
  var geo = new THREE.BufferGeometry()
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3))
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3))
  geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1))
  geo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1))
  return geo
}

// ════════════════════════════════════════
// A — Plasma Core: animated internal plasma texture
// ════════════════════════════════════════
function buildPlasmaCore() {
  var group = new THREE.Group()
  var mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() }, uBaseSize: { value: 200.0 } },
    vertexShader: SHARED_VERT,
    fragmentShader: [
      'varying vec3 vColor;',
      'varying float vPhase;',
      'varying float vSize;',
      'uniform float uTime;',
      'void main() {',
      '  vec2 uv = gl_PointCoord - 0.5;',
      '  float d = length(uv) * 2.0;',
      '  if (d > 1.0) discard;',
      '',
      '  // Animated plasma inside the orb',
      '  float angle = atan(uv.y, uv.x);',
      '  float t = uTime * 0.8 + vPhase;',
      '  float plasma = sin(d * 8.0 - t * 3.0) * sin(angle * 3.0 + t * 2.0) * 0.5 + 0.5;',
      '  float plasma2 = sin(d * 12.0 + t * 2.5) * cos(angle * 5.0 - t * 1.5) * 0.5 + 0.5;',
      '  float combined = mix(plasma, plasma2, 0.5);',
      '',
      '  // Core structure',
      '  float core = exp(-d * d * 10.0);',
      '  float glow = exp(-d * d * 2.5);',
      '  float haze = exp(-d * 1.5) * 0.2;',
      '',
      '  // Plasma modulates the mid-ring',
      '  float plasmaRing = combined * glow * (1.0 - core) * 0.7;',
      '',
      '  float alpha = core + glow * 0.4 + haze + plasmaRing;',
      '  vec3 col = vColor * (glow * 0.7 + plasmaRing * 1.2 + haze * 0.3);',
      '  col = mix(col, vec3(1.0), core * 0.8);',
      '  gl_FragColor = vec4(col, alpha);',
      '}'
    ].join('\n'),
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, vertexColors: true,
  })
  group.add(new THREE.Points(buildGeo(), mat))
  return { group: group, tick: function(t) { mat.uniforms.uTime.value = t } }
}

// ════════════════════════════════════════
// B — Nebula Puff: soft cloud with internal noise
// ════════════════════════════════════════
function buildNebulaPuff() {
  var group = new THREE.Group()
  var mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() }, uBaseSize: { value: 250.0 } },
    vertexShader: SHARED_VERT,
    fragmentShader: [
      'varying vec3 vColor;',
      'varying float vPhase;',
      'uniform float uTime;',
      '',
      '// Simple hash noise',
      'float hash(vec2 p) {',
      '  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);',
      '}',
      'float noise(vec2 p) {',
      '  vec2 i = floor(p);',
      '  vec2 f = fract(p);',
      '  f = f * f * (3.0 - 2.0 * f);',
      '  float a = hash(i);',
      '  float b = hash(i + vec2(1.0, 0.0));',
      '  float c = hash(i + vec2(0.0, 1.0));',
      '  float d = hash(i + vec2(1.0, 1.0));',
      '  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);',
      '}',
      '',
      'void main() {',
      '  vec2 uv = gl_PointCoord - 0.5;',
      '  float d = length(uv) * 2.0;',
      '  if (d > 1.0) discard;',
      '',
      '  float t = uTime * 0.4 + vPhase;',
      '',
      '  // Layered noise for cloud texture',
      '  vec2 noiseUv = uv * 6.0 + vec2(t * 0.5, t * 0.3);',
      '  float n = noise(noiseUv) * 0.5 + noise(noiseUv * 2.0 + 1.0) * 0.3 + noise(noiseUv * 4.0 + 2.0) * 0.2;',
      '',
      '  // Soft cloud shape',
      '  float shape = exp(-d * d * 1.8);',
      '  float core = exp(-d * d * 8.0);',
      '  float edge = smoothstep(1.0, 0.3, d);',
      '',
      '  // Noise modulates density',
      '  float density = shape * (0.5 + n * 0.8);',
      '',
      '  float alpha = density * edge + core * 0.8;',
      '  vec3 col = vColor * density * 1.2;',
      '  col = mix(col, vec3(1.0), core * 0.6);',
      '  // Slight color variation from noise',
      '  col += vColor * n * 0.2;',
      '',
      '  gl_FragColor = vec4(col, alpha);',
      '}'
    ].join('\n'),
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, vertexColors: true,
  })
  group.add(new THREE.Points(buildGeo(), mat))
  return { group: group, tick: function(t) { mat.uniforms.uTime.value = t } }
}

// ════════════════════════════════════════
// C — Star Flare: bright core with animated diffraction spikes
// ════════════════════════════════════════
function buildStarFlare() {
  var group = new THREE.Group()
  var mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() }, uBaseSize: { value: 220.0 } },
    vertexShader: SHARED_VERT,
    fragmentShader: [
      'varying vec3 vColor;',
      'varying float vPhase;',
      'uniform float uTime;',
      'void main() {',
      '  vec2 uv = gl_PointCoord - 0.5;',
      '  float d = length(uv) * 2.0;',
      '  if (d > 1.0) discard;',
      '',
      '  float angle = atan(uv.y, uv.x);',
      '  float t = uTime * 0.5 + vPhase;',
      '',
      '  // Core',
      '  float core = exp(-d * d * 15.0);',
      '  float glow = exp(-d * d * 3.0);',
      '',
      '  // 4-point diffraction spikes that slowly rotate',
      '  float spikeAngle = angle + t * 0.3;',
      '  float spike4 = pow(abs(cos(spikeAngle * 2.0)), 40.0) * exp(-d * 2.0);',
      '',
      '  // 6-point secondary spikes',
      '  float spike6 = pow(abs(cos((angle - t * 0.2) * 3.0)), 60.0) * exp(-d * 2.5) * 0.4;',
      '',
      '  // Shimmer',
      '  float shimmer = 0.9 + 0.1 * sin(d * 20.0 - t * 8.0);',
      '',
      '  float alpha = core + glow * 0.5 + spike4 * 0.6 + spike6 * 0.3;',
      '  alpha *= shimmer;',
      '',
      '  vec3 col = vColor * (glow * 0.7 + spike4 * 0.5 + spike6 * 0.3);',
      '  col = mix(col, vec3(1.0), core * 0.85);',
      '  // Spike color slightly whiter',
      '  col += vec3(1.0) * spike4 * 0.15;',
      '',
      '  gl_FragColor = vec4(col, alpha);',
      '}'
    ].join('\n'),
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, vertexColors: true,
  })
  group.add(new THREE.Points(buildGeo(), mat))
  return { group: group, tick: function(t) { mat.uniforms.uTime.value = t } }
}

// ════════════════════════════════════════
// D — Electric Ember: flickering with electric arcs
// ════════════════════════════════════════
function buildElectricEmber() {
  var group = new THREE.Group()
  var mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() }, uBaseSize: { value: 200.0 } },
    vertexShader: SHARED_VERT,
    fragmentShader: [
      'varying vec3 vColor;',
      'varying float vPhase;',
      'uniform float uTime;',
      '',
      'float hash(float n) { return fract(sin(n) * 43758.5453); }',
      '',
      'void main() {',
      '  vec2 uv = gl_PointCoord - 0.5;',
      '  float d = length(uv) * 2.0;',
      '  if (d > 1.0) discard;',
      '',
      '  float angle = atan(uv.y, uv.x);',
      '  float t = uTime + vPhase;',
      '',
      '  // Core with flicker',
      '  float flicker = 0.85 + 0.15 * sin(t * 12.0) * sin(t * 7.3 + 1.0);',
      '  float core = exp(-d * d * 12.0) * flicker;',
      '  float glow = exp(-d * d * 3.0);',
      '',
      '  // Electric arcs — jagged radial lines',
      '  float arcCount = 5.0;',
      '  float arcAngle = angle * arcCount + t * 3.0;',
      '  float arc = 0.0;',
      '  for (float i = 0.0; i < 3.0; i += 1.0) {',
      '    float offset = hash(floor(arcAngle + i * 13.7 + floor(t * 4.0))) * 0.3;',
      '    float arcD = abs(fract(arcAngle / 6.283 + offset) - 0.5);',
      '    arc += exp(-arcD * arcD * 800.0) * exp(-d * 2.5) * 0.35;',
      '  }',
      '',
      '  // Outer crackle',
      '  float crackle = hash(floor(angle * 8.0 + t * 6.0)) * exp(-abs(d - 0.7) * 8.0) * 0.2;',
      '',
      '  float alpha = core + glow * 0.4 + arc + crackle;',
      '  vec3 col = vColor * (glow * 0.6 + arc * 1.0 + crackle * 0.8);',
      '  col = mix(col, vec3(1.0), core * 0.75);',
      '  // Arcs slightly whiter',
      '  col += vec3(0.8, 0.9, 1.0) * arc * 0.3;',
      '',
      '  gl_FragColor = vec4(col, alpha);',
      '}'
    ].join('\n'),
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, vertexColors: true,
  })
  group.add(new THREE.Points(buildGeo(), mat))
  return { group: group, tick: function(t) { mat.uniforms.uTime.value = t } }
}

var modes = [buildPlasmaCore(), buildNebulaPuff(), buildStarFlare(), buildElectricEmber()]
var currentMode = 0
for (var i = 0; i < modes.length; i++) {
  modes[i].group.visible = (i === 0)
  pivot.add(modes[i].group)
}

var descriptions = [
  'A — Plasma Core: animated swirling plasma texture inside the orb. White-hot center, colored plasma mid-ring.',
  'B — Nebula Puff: layered noise cloud with soft edges. Each node is a tiny nebula. Organic, dreamy.',
  'C — Star Flare: bright core with rotating 4+6 point diffraction spikes. Shimmer ripple. Actual star feel.',
  'D — Electric Ember: flickering core with jagged electric arcs radiating outward. Outer crackle noise. Alive, dangerous.'
]

function setMode(idx) {
  for (var i = 0; i < modes.length; i++) modes[i].group.visible = (i === idx)
  currentMode = idx
  document.getElementById('info').textContent = descriptions[idx]
  var tabs = document.querySelectorAll('.tab')
  for (var i = 0; i < tabs.length; i++) tabs[i].className = 'tab' + (i === idx ? ' active' : '')
}
window.setMode = setMode
setMode(0)

window.addEventListener('resize', function() {
  W = window.innerWidth; H = window.innerHeight
  renderer.setSize(W, H)
  camera.aspect = W / H; camera.updateProjectionMatrix()
})

var elapsed = 0, lastTime = performance.now()
function animate() {
  var now = performance.now()
  var dt = Math.min((now - lastTime) / 1000, 0.05)
  lastTime = now
  elapsed += dt
  pivot.rotation.y += dt * 0.12
  for (var i = 0; i < modes.length; i++) modes[i].tick(elapsed)
  renderer.render(scene, camera)
  requestAnimationFrame(animate)
}
animate()
</script>
</body>
</html>

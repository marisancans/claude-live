<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>History Entrance Animations</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
  h1 { text-align: center; padding: 20px 0 10px; font-size: 18px; color: #8af; letter-spacing: 2px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; height: calc(100vh - 60px); }
  .cell { position: relative; background: #050510; border: 1px solid #1a1a3a; border-radius: 8px; overflow: hidden; }
  .cell canvas { width: 100% !important; height: 100% !important; }
  .label { position: absolute; top: 10px; left: 14px; font-size: 14px; font-weight: 600; color: #adf; z-index: 1; text-shadow: 0 0 10px #48f; pointer-events: none; }
  .sublabel { position: absolute; top: 30px; left: 14px; font-size: 11px; color: #689; z-index: 1; pointer-events: none; }
  .replay { position: absolute; bottom: 12px; right: 14px; background: rgba(40,60,120,0.6); border: 1px solid #48a; color: #adf; padding: 6px 16px; border-radius: 4px; cursor: pointer; font-size: 12px; z-index: 1; }
  .replay:hover { background: rgba(60,90,180,0.7); }
</style>
</head>
<body>
<h1>HISTORY ENTRANCE ANIMATIONS</h1>
<div class="grid">
  <div class="cell" id="cell-a">
    <div class="label">A — Warp-In</div>
    <div class="sublabel">Stars streak from deep space to position</div>
    <button class="replay" onclick="demos[0].replay()">Replay</button>
  </div>
  <div class="cell" id="cell-b">
    <div class="label">B — Nebula Condensation</div>
    <div class="sublabel">Diffuse cloud coalesces into stars</div>
    <button class="replay" onclick="demos[1].replay()">Replay</button>
  </div>
  <div class="cell" id="cell-c">
    <div class="label">C — Cascade Waves</div>
    <div class="sublabel">Stars appear in time-ordered ripples from core</div>
    <button class="replay" onclick="demos[2].replay()">Replay</button>
  </div>
  <div class="cell" id="cell-d">
    <div class="label">D — Reverse Explosion</div>
    <div class="sublabel">Big Bang — stars blast outward from core</div>
    <button class="replay" onclick="demos[3].replay()">Replay</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'

// ── Shared config ──
const STAR_COUNT = 200
const TOOL_COLORS = ['#4fc3f7','#81c784','#ffb74d','#e57373','#ba68c8','#4dd0e1','#fff176','#f48fb1','#a1887f','#90a4ae']

function randomColor() {
  return new THREE.Color(TOOL_COLORS[Math.floor(Math.random() * TOOL_COLORS.length)])
}

function randomFinalPos() {
  const rx = (Math.random() - 0.5) * 2 * (20 + Math.pow(Math.random(), 0.6) * 100) * (0.4 + Math.random() * 2.1)
  const ry = (Math.random() - 0.5) * 2 * (20 + Math.pow(Math.random(), 0.6) * 100) * (0.1 + Math.random() * 0.4)
  const rz = (Math.random() - 0.5) * 2 * (20 + Math.pow(Math.random(), 0.6) * 100) * (0.4 + Math.random() * 2.1)
  return new THREE.Vector3(rx, ry, rz)
}

// Easing functions
function easeOutExpo(t) { return t === 1 ? 1 : 1 - Math.pow(2, -10 * t) }
function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2 }
function easeOutBack(t) { const c1=1.70158; const c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2) }
function easeOutElastic(t) { if(t===0||t===1) return t; return Math.pow(2,-10*t)*Math.sin((t*10-0.75)*(2*Math.PI)/3)+1 }

// ── Scene factory ──
function createScene(cellId) {
  const cell = document.getElementById(cellId)
  const W = cell.clientWidth, H = cell.clientHeight

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false })
  renderer.setSize(W, H)
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
  renderer.setClearColor(0x000008)
  cell.appendChild(renderer.domElement)

  const scene = new THREE.Scene()
  const camera = new THREE.PerspectiveCamera(60, W / H, 1, 3000)
  camera.position.set(0, 60, 200)

  const controls = new OrbitControls(camera, renderer.domElement)
  controls.enableDamping = true
  controls.dampingFactor = 0.05
  controls.autoRotate = true
  controls.autoRotateSpeed = 0.4
  controls.target.set(0, 0, 0)

  // Bloom
  const composer = new EffectComposer(renderer)
  composer.addPass(new RenderPass(scene, camera))
  const bloom = new UnrealBloomPass(new THREE.Vector2(W/2, H/2), 1.4, 0.5, 0.15)
  composer.addPass(bloom)

  // Core wireframe icosahedron
  const icoGeo = new THREE.IcosahedronGeometry(6, 1)
  const icoEdges = new THREE.EdgesGeometry(icoGeo)
  const icoMat = new THREE.LineBasicMaterial({ color: 0x4488ff, transparent: true, opacity: 0.5 })
  const ico = new THREE.LineSegments(icoEdges, icoMat)
  scene.add(ico)

  // Core glow — Three.js sprite with procedural texture
  const glowCanvas = document.createElement('canvas')
  glowCanvas.width = glowCanvas.height = 128
  const gCtx = glowCanvas.getContext('2d')
  const grad = gCtx.createRadialGradient(64,64,0,64,64,64)
  grad.addColorStop(0, 'rgba(80,140,255,0.6)')
  grad.addColorStop(0.4, 'rgba(40,80,200,0.2)')
  grad.addColorStop(1, 'rgba(0,0,40,0)')
  gCtx.fillStyle = grad
  gCtx.fillRect(0,0,128,128)
  const glowTex = new THREE.CanvasTexture(glowCanvas)
  const glowMat = new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false })
  const glow = new THREE.Sprite(glowMat)
  glow.scale.set(25, 25, 1)
  scene.add(glow)

  const onResize = () => {
    const w = cell.clientWidth, h = cell.clientHeight
    renderer.setSize(w, h)
    composer.setSize(w, h)
    camera.aspect = w / h
    camera.updateProjectionMatrix()
  }
  window.addEventListener('resize', onResize)

  return { renderer, scene, camera, controls, composer, ico }
}

// ══════════════════════════════════════════════════════
// A — WARP-IN: Stars streak from deep space
// ══════════════════════════════════════════════════════
function createWarpIn(cellId) {
  const { scene, camera, controls, composer, ico } = createScene(cellId)
  let stars = []
  let elapsed = 0
  const DURATION = 2.5

  function generateStars() {
    // Remove old
    for (const s of stars) { scene.remove(s.mesh); scene.remove(s.trail) }
    stars = []
    elapsed = 0

    for (let i = 0; i < STAR_COUNT; i++) {
      const finalPos = randomFinalPos()
      const color = randomColor()
      const delay = Math.random() * 1.2 // stagger

      // Start far behind camera, along the line from origin through finalPos
      const dir = finalPos.clone().normalize()
      const startPos = dir.multiplyScalar(800 + Math.random() * 600)

      // Star mesh — small glowing sphere
      const geo = new THREE.SphereGeometry(0.6, 6, 4)
      const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0 })
      const mesh = new THREE.Mesh(geo, mat)
      mesh.position.copy(startPos)
      scene.add(mesh)

      // Trail line
      const trailGeo = new THREE.BufferGeometry()
      const trailPositions = new Float32Array(6)
      trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3))
      const trailMat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0, blending: THREE.AdditiveBlending })
      const trail = new THREE.Line(trailGeo, trailMat)
      scene.add(trail)

      stars.push({ mesh, mat, trail, trailMat, trailGeo, startPos: startPos.clone(), finalPos, delay, settled: false })
    }
  }

  function tick(dt) {
    elapsed += dt
    ico.rotation.y += dt * 0.12
    ico.rotation.x += dt * 0.05

    for (const s of stars) {
      const t = Math.max(0, elapsed - s.delay) / DURATION
      if (t <= 0) continue
      const p = Math.min(t, 1)
      const e = easeOutExpo(p)

      s.mesh.position.lerpVectors(s.startPos, s.finalPos, e)
      s.mat.opacity = Math.min(1, t * 3)

      // Trail: from slightly behind to current pos
      const trailStart = s.mesh.position.clone().add(
        s.startPos.clone().sub(s.finalPos).normalize().multiplyScalar(Math.max(2, (1 - p) * 40))
      )
      const tPos = s.trailGeo.attributes.position
      tPos.array[0] = trailStart.x; tPos.array[1] = trailStart.y; tPos.array[2] = trailStart.z
      tPos.array[3] = s.mesh.position.x; tPos.array[4] = s.mesh.position.y; tPos.array[5] = s.mesh.position.z
      tPos.needsUpdate = true
      s.trailMat.opacity = (1 - p) * 0.7

      if (p >= 1 && !s.settled) {
        s.settled = true
        s.mat.opacity = 0.75
      }
    }

    controls.update()
    composer.render()
  }

  generateStars()
  return { tick, replay: generateStars }
}

// ══════════════════════════════════════════════════════
// B — NEBULA CONDENSATION: Cloud coalesces
// ══════════════════════════════════════════════════════
function createNebula(cellId) {
  const { scene, camera, controls, composer, ico } = createScene(cellId)
  let stars = []
  let elapsed = 0
  const DURATION = 4.0

  function generateStars() {
    for (const s of stars) { scene.remove(s.mesh) }
    stars = []
    elapsed = 0

    for (let i = 0; i < STAR_COUNT; i++) {
      const finalPos = randomFinalPos()
      const color = randomColor()

      // Start with large random offset from final pos (diffuse cloud)
      const offset = new THREE.Vector3(
        (Math.random()-0.5) * 300,
        (Math.random()-0.5) * 120,
        (Math.random()-0.5) * 300,
      )
      const startPos = finalPos.clone().add(offset)
      const delay = Math.random() * 0.5

      const geo = new THREE.SphereGeometry(1.2, 6, 4) // start bigger
      const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.05 })
      const mesh = new THREE.Mesh(geo, mat)
      mesh.position.copy(startPos)
      scene.add(mesh)

      stars.push({ mesh, mat, geo, startPos: startPos.clone(), finalPos, delay, initialScale: 1.2 })
    }
  }

  function tick(dt) {
    elapsed += dt
    ico.rotation.y += dt * 0.12
    ico.rotation.x += dt * 0.05

    for (const s of stars) {
      const t = Math.max(0, elapsed - s.delay) / DURATION
      if (t <= 0) continue
      const p = Math.min(t, 1)
      const e = easeInOutCubic(p)

      // Drift from cloud position to final
      s.mesh.position.lerpVectors(s.startPos, s.finalPos, e)

      // Fade in and shrink to final size
      s.mat.opacity = 0.05 + e * 0.7
      const scale = s.initialScale * (1 + (1 - e) * 2) // start 3x bigger, shrink to 1x
      s.mesh.scale.setScalar(scale * (0.5 / s.initialScale)) // end at 0.5 radius

      // Gentle drift/wobble while condensing
      if (p < 1) {
        const wobble = (1 - p) * 2
        s.mesh.position.x += Math.sin(elapsed * 2 + s.delay * 10) * wobble * dt
        s.mesh.position.y += Math.cos(elapsed * 1.7 + s.delay * 7) * wobble * dt
        s.mesh.position.z += Math.sin(elapsed * 1.3 + s.delay * 13) * wobble * dt
      }
    }

    controls.update()
    composer.render()
  }

  generateStars()
  return { tick, replay: generateStars }
}

// ══════════════════════════════════════════════════════
// C — CASCADE WAVES: Rippling outward from core
// ══════════════════════════════════════════════════════
function createCascade(cellId) {
  const { scene, camera, controls, composer, ico } = createScene(cellId)
  let stars = []
  let elapsed = 0
  const WAVE_DURATION = 0.8
  const TOTAL_SPREAD = 3.0 // time for all waves

  // Shockwave ring
  const ringGeo = new THREE.RingGeometry(0.5, 1, 64)
  const ringMat = new THREE.MeshBasicMaterial({ color: 0x4488ff, transparent: true, opacity: 0, side: THREE.DoubleSide, blending: THREE.AdditiveBlending })
  const ring = new THREE.Mesh(ringGeo, ringMat)
  ring.rotation.x = -Math.PI / 2
  scene.add(ring)
  let ringTimer = -1

  function generateStars() {
    for (const s of stars) { scene.remove(s.mesh) }
    stars = []
    elapsed = 0
    ringTimer = 0

    // Sort by distance from origin (inner first)
    const raw = []
    for (let i = 0; i < STAR_COUNT; i++) {
      raw.push({ finalPos: randomFinalPos(), color: randomColor() })
    }
    raw.sort((a, b) => a.finalPos.length() - b.finalPos.length())

    for (let i = 0; i < raw.length; i++) {
      const { finalPos, color } = raw[i]
      const delay = (i / raw.length) * TOTAL_SPREAD

      const geo = new THREE.SphereGeometry(0.5, 6, 4)
      const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0 })
      const mesh = new THREE.Mesh(geo, mat)
      mesh.position.set(0, 0, 0) // start at core
      mesh.scale.setScalar(0.01)
      scene.add(mesh)

      stars.push({ mesh, mat, finalPos, delay })
    }
  }

  function tick(dt) {
    elapsed += dt
    ico.rotation.y += dt * 0.12
    ico.rotation.x += dt * 0.05

    // Shockwave ring
    if (ringTimer >= 0) {
      ringTimer += dt
      const rp = ringTimer / 2.5
      if (rp <= 1) {
        ring.scale.setScalar(1 + rp * 200)
        ringMat.opacity = (1 - rp) * 0.3
      } else {
        ringMat.opacity = 0
      }
    }

    for (const s of stars) {
      const t = Math.max(0, elapsed - s.delay) / WAVE_DURATION
      if (t <= 0) continue
      const p = Math.min(t, 1)
      const e = easeOutBack(p)

      s.mesh.position.lerpVectors(new THREE.Vector3(0,0,0), s.finalPos, e)
      s.mat.opacity = Math.min(0.8, p * 2)
      s.mesh.scale.setScalar(0.01 + e * 0.99)
    }

    controls.update()
    composer.render()
  }

  generateStars()
  return { tick, replay: generateStars }
}

// ══════════════════════════════════════════════════════
// D — REVERSE EXPLOSION: Big Bang from core
// ══════════════════════════════════════════════════════
function createExplosion(cellId) {
  const { scene, camera, controls, composer, ico } = createScene(cellId)
  let stars = []
  let elapsed = 0
  const DURATION = 1.8

  // Flash sphere
  const flashGeo = new THREE.SphereGeometry(3, 16, 12)
  const flashMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending })
  const flash = new THREE.Mesh(flashGeo, flashMat)
  scene.add(flash)

  function generateStars() {
    for (const s of stars) { scene.remove(s.mesh); if(s.trail) scene.remove(s.trail) }
    stars = []
    elapsed = 0

    for (let i = 0; i < STAR_COUNT; i++) {
      const finalPos = randomFinalPos()
      const color = randomColor()
      const delay = Math.random() * 0.15 // tight cluster, nearly simultaneous

      const geo = new THREE.SphereGeometry(0.5, 6, 4)
      const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0 })
      const mesh = new THREE.Mesh(geo, mat)
      mesh.position.set(0, 0, 0)
      scene.add(mesh)

      // Radial trail
      const trailGeo = new THREE.BufferGeometry()
      const trailPositions = new Float32Array(6)
      trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3))
      const trailMat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0, blending: THREE.AdditiveBlending })
      const trail = new THREE.Line(trailGeo, trailMat)
      scene.add(trail)

      stars.push({ mesh, mat, trail, trailMat, trailGeo, finalPos, delay })
    }
  }

  function tick(dt) {
    elapsed += dt
    ico.rotation.y += dt * 0.12
    ico.rotation.x += dt * 0.05

    // Initial flash
    if (elapsed < 0.6) {
      flash.scale.setScalar(1 + elapsed * 30)
      flashMat.opacity = Math.max(0, 0.8 - elapsed * 2)
    } else {
      flashMat.opacity = 0
    }

    for (const s of stars) {
      const t = Math.max(0, elapsed - s.delay) / DURATION
      if (t <= 0) continue
      const p = Math.min(t, 1)

      // Two-phase: fast overshoot then settle
      let e
      if (p < 0.6) {
        // Blast out to 1.15x
        e = easeOutExpo(p / 0.6) * 1.15
      } else {
        // Settle back from 1.15x to 1.0x
        const settle = (p - 0.6) / 0.4
        e = 1.15 - 0.15 * easeInOutCubic(settle)
      }

      s.mesh.position.copy(s.finalPos).multiplyScalar(e)
      s.mat.opacity = Math.min(0.8, t * 4)

      // Trail from core outward
      const trailLen = Math.max(2, (1 - p) * 25)
      const trailEnd = s.mesh.position.clone()
      const trailStart = trailEnd.clone().normalize().multiplyScalar(Math.max(0, trailEnd.length() - trailLen))
      const tPos = s.trailGeo.attributes.position
      tPos.array[0] = trailStart.x; tPos.array[1] = trailStart.y; tPos.array[2] = trailStart.z
      tPos.array[3] = trailEnd.x; tPos.array[4] = trailEnd.y; tPos.array[5] = trailEnd.z
      tPos.needsUpdate = true
      s.trailMat.opacity = (1 - p) * 0.6
    }

    controls.update()
    composer.render()
  }

  generateStars()
  return { tick, replay: generateStars }
}

// ── Boot all four ──
const demos = [
  createWarpIn('cell-a'),
  createNebula('cell-b'),
  createCascade('cell-c'),
  createExplosion('cell-d'),
]
window.demos = demos

let lastTime = performance.now()
function animate() {
  const now = performance.now()
  const dt = Math.min((now - lastTime) / 1000, 0.05)
  lastTime = now
  for (const d of demos) d.tick(dt)
  requestAnimationFrame(animate)
}
animate()
</script>
</body>
</html>
